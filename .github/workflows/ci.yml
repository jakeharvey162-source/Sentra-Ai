name: Sentra CI

on:
  push:
    branches:
      - main
      - build/sentra-foundation
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run security core tests
        run: npm run test:security

      - name: Build application
        run: npm run build
