name: Sentra CI

on:
  push:
    branches:
      - main
      - build/sentra-foundation
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run security core tests
        run: npm run test:security

      - name: Build application
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: npm run build

      - name: Check repository for committed secrets
        run: |
          if grep -RInE "(sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{20,}|ghp_[0-9A-Za-z]{20,})" . --exclude-dir=.git --exclude-dir=node_modules; then
            echo "Potential committed secret detected"
            exit 1
          fi
