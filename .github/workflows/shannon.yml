name: Shannon Authorized Pentest

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Authorized Sentra staging URL"
        required: true
        type: string
      authorization:
        description: "Type I_AM_AUTHORIZED to confirm ownership/permission"
        required: true
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  pentest:
    if: ${{ inputs.authorization == 'I_AM_AUTHORIZED' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Sentra
        uses: actions/checkout@v4

      - name: Verify target scope
        shell: bash
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          python3 - <<'PY_SCOPE'
          import os
          from urllib.parse import urlsplit
          target = urlsplit(os.environ["TARGET_URL"])
          if (target.scheme != "https" or target.hostname != "sentra-ai-7lij.vercel.app"
              or target.username or target.password or target.port not in (None, 443)
              or target.path not in ("", "/") or target.query or target.fragment):
              raise SystemExit("Refusing target outside the authorised Sentra origin.")
          PY_SCOPE

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check Shannon provider secret
        shell: bash
        env:
          SHANNON_AI_API_KEY: ${{ secrets.SHANNON_AI_API_KEY }}
        run: |
          if [ -z "$SHANNON_AI_API_KEY" ]; then
            echo "Missing SHANNON_AI_API_KEY GitHub Actions secret."
            exit 1
          fi

      - name: Run Shannon against authorised Sentra staging
        shell: bash
        env:
          SHANNON_AI_API_KEY: ${{ secrets.SHANNON_AI_API_KEY }}
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          echo "Shannon requires provider-specific setup. This workflow is intentionally gated."
          printf 'Target: %s\n' "$TARGET_URL"
          npx --yes @keygraph/shannon@latest start \
            -u "$TARGET_URL" \
            -r "$GITHUB_WORKSPACE"

      - name: Locate Shannon SARIF
        id: sarif
        if: always()
        shell: bash
        run: |
          file="$(find . -type f \( -name '*.sarif' -o -name '*sarif.json' \) | head -n 1)"
          if [ -n "$file" ]; then
            echo "file=$file" >> "$GITHUB_OUTPUT"
            echo "Found SARIF: $file"
          else
            echo "No SARIF report found."
          fi

      - name: Normalize findings for Sentra Blue Team
        if: steps.sarif.outputs.file != ''
        run: npm run shannon:import -- "${{ steps.sarif.outputs.file }}"

      - name: Upload Shannon evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shannon-sentra-pentest
          path: |
            test-lab/results/shannon-normalized.json
            **/*.sarif
            **/*shannon*.md
            **/*shannon*.pdf
          if-no-files-found: warn
